name: Trading research
on:
  push:
    paths:
      - "options-research/**"
      - ".github/workflows/trading-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks-and-stock-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Engine verification
        working-directory: options-research
        run: node cli.mjs test
      - name: Download completed historical stock sessions
        working-directory: options-research
        run: node cli.mjs download --symbols SPY,QQQ,RDDT --out data
      - name: Research two years with reserved holdout
        working-directory: options-research
        run: |
          START=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('data/manifest.json','utf8')).researchStart)")
          node cli.mjs research --prices data/prices.csv --start "$START" --source-label Yahoo-raw-OHLC --out reports
      - name: Store research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-stock-baseline
          path: |
            options-research/reports/
            options-research/data/manifest.json
          if-no-files-found: ignore
